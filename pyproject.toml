[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fossil-finder"
version = "0.1.0"
description = "Multi-genome TE fossil mining and regulatory analysis framework"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "biopython>=1.82",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.28",
    "tqdm>=4.64",
]

[project.optional-dependencies]
analysis = [
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]
scoring = [
    "torch>=2.0",
    "transformers>=4.55",
    "pyfaidx>=0.7",
]
workflow = [
    "snakemake>=8.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
all = ["fossil-finder[analysis,scoring,workflow,dev]"]

[tool.hatch.build.targets.wheel]
packages = ["src/fossil_finder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
